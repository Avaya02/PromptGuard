server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed bundles are immutable; index.html must never be cached or clients
  # keep loading a stale asset manifest after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    # SPA routes are client-side, so unknown paths fall back to the shell.
    try_files $uri $uri/ /index.html;
  }
}
