services:
  postgres:
    image: postgres:16-alpine
    container_name: diditbreak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: diditbreak
      POSTGRES_PASSWORD: diditbreak
      POSTGRES_DB: diditbreak
    ports:
      - "5433:5432"
    volumes:
      - diditbreak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diditbreak -d diditbreak"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: diditbreak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - diditbreak-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    container_name: diditbreak-api
    restart: unless-stopped
    environment:
      # Service names resolve on the compose network, so the internal port is
      # 5432 even though the host maps it to 5433.
      DATABASE_URL: postgresql://diditbreak:diditbreak@postgres:5432/diditbreak?schema=public
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: diditbreak-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://diditbreak:diditbreak@postgres:5432/diditbreak?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The API applies migrations on boot; the worker must not race it.
      api-server:
        condition: service_started

  web-dashboard:
    build:
      context: .
      dockerfile: apps/web-dashboard/Dockerfile
    container_name: diditbreak-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-server

volumes:
  diditbreak-postgres:
  diditbreak-redis:
