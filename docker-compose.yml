version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: promptguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: promptguard
      POSTGRES_PASSWORD: promptguard
      POSTGRES_DB: promptguard
    ports:
      - "5433:5432"
    volumes:
      - promptguard-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: promptguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - promptguard-redis:/data

volumes:
  promptguard-postgres:
  promptguard-redis:
